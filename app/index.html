<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VICE HEAT Cover Studio — GTA 6 style poster covers</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="top">
  <h1>VICE <span>HEAT</span></h1>
  <p>Cover Studio — turn a photo and a caption into GTA 6 style poster art. Offline, right here.</p>
</header>
<main class="studio">
  <section class="stage" id="stage">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
    <div id="faceBox" title="Drag so the face stays clear of the title"></div>
    <p class="hint">Drag the cyan face box so the lead's face stays in the top third, clear of the title. The cover repaints as you work.</p>
  </section>
  <aside class="panel">
    <section>
      <h2>Layout</h2>
      <div class="grid" id="layoutGrid"></div>
    </section>
    <section>
      <h2>Grade</h2>
      <div class="grid" id="gradeGrid"></div>
    </section>
    <section>
      <h2>Grade tune</h2>
      <label class="row">Painterly <input id="slPainterly" type="range" min="0" max="100" value="35"></label>
      <label class="row">Ink <input id="slInk" type="range" min="0" max="100" value="22"></label>
      <label class="row">Halftone <input id="slHalftone" type="range" min="0" max="100" value="8"></label>
      <label class="row">Keep skin <input id="slSkin" type="range" min="0" max="100" value="70"></label>
      <label class="check"><input id="halftoneToggle" type="checkbox" checked> Halftone dots</label>
    </section>
    <section>
      <h2>Words</h2>
      <label class="row">Title <input id="inTitle" type="text" maxlength="24" value="VICE HEAT"></label>
      <label class="row">Script <input id="inScript" type="text" maxlength="20" value="Leonida"></label>
      <label class="row">Quote <input id="inQuote" type="text" maxlength="60" value="THE CITY NEVER LOOKED THIS GOOD."></label>
      <label class="row">Tagline <input id="inTagline" type="text" maxlength="40" value="EVERY SUNSET HAS A PRICE."></label>
      <label class="row">Place <input id="inPlace" type="text" maxlength="48" value="LEONIDA — VICE CITY"></label>
      <label class="check"><input id="wantedToggle" type="checkbox" checked> WANTED badge</label>
    </section>
    <button id="surpriseBtn" type="button">Surprise me</button>
    <section class="exports">
      <h2>Export PNG</h2>
      <button type="button" data-export="1920x1080">Export 1920 × 1080 — wide</button>
      <button type="button" data-export="1080x1350">Export 1080 × 1350 — portrait</button>
      <button type="button" data-export="1080x1080">Export 1080 × 1080 — square</button>
      <p id="status" role="status"></p>
    </section>
  </aside>
</main>
<script type="module" src="./src/app.js"></script>
</body>
</html>
